<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A great way to annoy a girl - Book 1</title>
    <meta name="description" content="A gaslit card trick on Baker Street. Turn the card, open the grimoire, and step into the Midnight Gazette exhibition.">
    <meta name="theme-color" content="#0b0b0e">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="manifest" href="site.webmanifest">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/parlor.css">
    <link rel="preload" as="image" href="images/card-front.jpg">
    <link rel="preload" as="image" href="images/card-back.jpg">
    <link rel="preload" as="image" href="images/london.jpg">
    <link rel="prefetch" href="exhibition.html">
</head>
<body>
    <div id="flash-overlay"></div>

    <header class="victorian-header">
        <!-- <h1>Mistery unravels</h1> -->
        <p class="era-kicker">London, 1890</p>
        <p class="era-sub">For more adventures yet to come...</p>
    </header>

    <div class="scene" id="cardScene">
        <div class="card-container" id="magicCard">
            <div class="card-face card-front">
                <img src="images/card-front.jpg" alt="A foggy cobbled bridge leading up to a castle gate">
            </div>
            <div class="card-face card-back">
                <img src="images/card-back.jpg" alt="The same castle reflected in still water">
            </div>
        </div>
    </div>

    <div class="book-container" id="flyingBook" aria-hidden="true">
        <div class="book-spine-wrapper" id="bookSpineWrapper">
            <div class="book-spine-center"></div>

            <div class="book-right-half">
                <div class="book-page-content right-page-shadow portal-page">
                    <div class="book-title">Secret Portal</div>
                    <img class="portal-arc" src="images/portal_arc.jpg" alt="A stone arch filled with a swirling portal">
                </div>
            </div>

            <div class="book-left-flap" id="bookLeftFlap">
                <div class="cover-front-face">
                    <h2>Grimoire of adventures</h2>
                    <div class="emblem" aria-hidden="true">⚜</div>
                </div>
                <div class="cover-inside-page">
                    <div class="book-page-content left-page-shadow">
                        <div class="book-title">Vol. XIX — The Passage</div>
                        <p class="book-text">On a foggy eve in November 1890, the gas lamps of Baker Street flickered as the veil between worlds grew thin...</p>
                        <img class="book-illustration" src="images/street.jpg" alt="Westminster Bridge and the clock tower">
                    </div>
                </div>
            </div>

            <div id="riffleStack"></div>
        </div>
    </div>

    <dialog class="gate" id="gateDialog" aria-labelledby="gateQuestion">
        <form id="gateForm">
            <p class="gate-kicker">The grimoire asks</p>
            <h2 id="gateQuestion" tabindex="-1"></h2>
            <label class="sr-only" for="gateAnswer">Your answer</label>
            <input id="gateAnswer" name="answer" type="text" autocomplete="off" spellcheck="false" required>
            <p class="gate-error" id="gateError" hidden>The stone portal does not yield.</p>
            <div class="gate-actions">
                <button type="button" class="plaque" id="gateClose">Close</button>
                <button type="submit" class="plaque" id="gateSubmit">Offer the answer</button>
            </div>
        </form>
    </dialog>

    <script src="js/gate.js"></script>
    <script src="js/parlor.js"></script>
</body>
</html>
